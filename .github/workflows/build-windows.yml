name: Build & Sign Windows

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download CodeSignTool
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.ssl.com/download/codesigntool-for-windows/" -OutFile "CodeSignTool.zip"
          Expand-Archive -Path "CodeSignTool.zip" -DestinationPath "C:\CodeSignTool" -Force
          $nested = Get-ChildItem "C:\CodeSignTool" -Directory | Select-Object -First 1
          if ($nested) { Move-Item "$($nested.FullName)\*" "C:\CodeSignTool\" -Force }

      - name: Install dependencies
        working-directory: App
        run: npm ci

      - name: Build and sign
        working-directory: App
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CODESIGNTOOL_PATH: 'C:\CodeSignTool\CodeSignTool.bat'
        run: npx electron-forge make --platform win32

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: App/out/make/squirrel.windows/**/*
