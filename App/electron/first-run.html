<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroFlow Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      -webkit-app-region: drag;
    }

    .container {
      width: 100%;
      height: 100%;
      background: #141413;
      border: 1px solid #8A8880;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px 40px;
    }

    .icon {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }

    h1 {
      font-size: 17px;
      font-weight: 600;
      color: #FAF9F5;
      text-align: center;
    }

    h1 .check {
      color: #788c5d;
      margin-left: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #B0AEA5;
      text-align: center;
      line-height: 1.5;
      max-width: 300px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      -webkit-app-region: no-drag;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.85;
    }

    .btn-primary {
      background: #788c5d;
      color: #FAF9F5;
      border: 1px solid #788c5d;
    }

    .btn-secondary {
      background: transparent;
      color: #B0AEA5;
      border: 1px solid #8A8880;
    }

    .btn-secondary:hover {
      color: #FAF9F5;
      border-color: #B0AEA5;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="icon" src="../assets/app-icon.png" alt="MacroFlow" />
    <h1>MacroFlow installed successfully<span class="check">&#x2713;</span></h1>
    <p class="subtitle">
      The Excel add-in will load automatically the next time you open Excel.
    </p>
    <div class="buttons">
      <button class="btn-primary" onclick="window.installer.openExcel()">Open Excel</button>
      <button class="btn-secondary" onclick="window.installer.done()">Done</button>
    </div>
  </div>
</body>
</html>
