<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>MacroFlow</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="vscode-layout">
        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Chat Panel - Now on Left -->
            <aside class="chat-panel" id="chatPanel">
                <div class="chat-panel-header">
                    <span class="chat-panel-title">Chat</span>
                    <div class="chat-panel-actions">
                        <button id="toggleChatBtn" class="btn-icon" title="Collapse Chat">
                            <svg width="14" height="14" viewBox="0 0 16 16">
                                <rect x="3" y="3" width="10" height="10" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="6" y1="3" x2="6" y2="13" stroke="currentColor" stroke-width="1.2"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Chat Messages -->
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-welcome">
                        <div class="chat-welcome-content">
                            <h3>AI Assistant</h3>
                        </div>
                    </div>
                </div>
                
                <!-- Chat Input (Fixed at Bottom) -->
                <div class="chat-input-section">
                    <div class="chat-input-container">
                        <textarea 
                            id="prompt" 
                            placeholder="Plan, search, build anything"
                            rows="2"
                        ></textarea>
                        <!-- Bottom row with line indicator and send button -->
                        <div class="chat-bottom-row">
                            <div id="lineIndicator" class="line-indicator hidden">Focused on lines 7-30</div>
                            <button id="generateBtn" class="btn-send-inline" title="Send message">
                                <svg width="12" height="12" viewBox="0 0 16 16">
                                    <path fill="currentColor" d="M8 4l4 4h-3v4H7V8H4l4-4z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </aside>
            
            <!-- Editor Container - Stays in Middle -->
            <main class="editor-container">
                <!-- Editor Tabs -->
                <div class="editor-tabs" id="editorTabs">
                    <!-- Welcome tab removed - only show when no modules are open -->
                </div>
                
                <!-- Monaco Editor -->
                <div class="editor-wrapper">
                    <div id="monacoEditor" class="monaco-editor"></div>
                    <div id="welcomeScreen" class="welcome-screen">
                        <div class="welcome-content">
                            <h2>Welcome to MacroFlow</h2>
                            <p>Let's get started</p>
                            <div class="welcome-actions">
                                <button id="welcomeGenerate" class="btn-primary">Create New Module</button>
                            </div>
                        </div>
                    </div>
                </div>
                
            </main>
            
            <!-- File Sidebar - Now on Right -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-left-content">
                        <button id="toggleSidebarBtn" class="btn-icon" title="Collapse Explorer">
                            <svg width="14" height="14" viewBox="0 0 16 16">
                                <!-- Explorer toggle: rounded square with vertical line on left -->
                                <rect x="3" y="3" width="10" height="10" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="6" y1="3" x2="6" y2="13" stroke="currentColor" stroke-width="1.2"/>
                            </svg>
                        </button>
                        <span class="sidebar-title">Explorer</span>
                    </div>
                    <div class="sidebar-actions">
                        <button id="themeToggleBtn" class="btn-icon" title="Toggle Dark/Light Mode">
                            <svg width="14" height="14" viewBox="0 0 16 16">
                                <!-- Sun icon for light mode -->
                                <circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="8" y1="1" x2="8" y2="3" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="8" y1="13" x2="8" y2="15" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="15" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="3" y1="8" x2="1" y2="8" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="12.24" y1="3.76" x2="10.83" y2="5.17" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="5.17" y1="10.83" x2="3.76" y2="12.24" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="12.24" y1="12.24" x2="10.83" y2="10.83" stroke="currentColor" stroke-width="1.2"/>
                                <line x1="5.17" y1="5.17" x2="3.76" y2="3.76" stroke="currentColor" stroke-width="1.2"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- New Module Button -->
                <div class="sidebar-section">
                    <button id="addModuleBtn" class="new-module-btn">
                        <div class="module-name">
                            <svg width="16" height="16" viewBox="0 0 16 16">
                                <!-- Square -->
                                <rect x="2" y="4" width="10" height="10" rx="1" ry="1" fill="none" stroke="currentColor" stroke-width="1"/>
                                <!-- Smaller Pencil -->
                                <path fill="currentColor" d="M13.2 1.2l1.3 1.3c.22.22.22.58 0 .8l-.8.8-2.1-2.1L12.4 1.2c.22-.22.58-.22.8 0zM11.5 2.1l2.1 2.1-6.4 6.4c-.09.09-.21.14-.33.15l-2.2.11c-.11.005-.21-.04-.27-.12-.06-.08-.07-.19-.03-.29l.22-2.1c.02-.21.11-.4.26-.55L11.5 2.1z"/>
                            </svg>
                            <span>New module</span>
                        </div>
                    </button>
                </div>
                
                <!-- Search Macros -->
                <div class="sidebar-section">
                    <div class="search-container">
                        <div class="module-name">
                            <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16">
                                <path fill="currentColor" d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                            </svg>
                            <input type="text" id="searchMacros" placeholder="Search macros" class="search-input">
                        </div>
                    </div>
                </div>
                
                <!-- Module List -->
                <div class="sidebar-section modules-section">
                    <div class="module-list" id="moduleList">
                        <div class="module-item loading">
                            <span>Loading modules...</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
        
        <!-- Modal for new module name -->
        <div id="moduleNameModal" class="modal hidden">
            <div class="modal-content">
                <h3>Create New Module</h3>
                <label for="moduleNameInput">Enter module name:</label>
                <input type="text" id="moduleNameInput" placeholder="Module1" />
                <div class="modal-buttons">
                    <button id="createModuleOk" class="btn-primary">Create</button>
                    <button id="createModuleCancel" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
        
        <!-- Modal for rename module -->
        <div id="renameModuleModal" class="modal hidden">
            <div class="modal-content">
                <h3>Rename Module</h3>
                <label for="renameModuleInput">Enter new name:</label>
                <input type="text" id="renameModuleInput" placeholder="Module1" />
                <div class="modal-buttons">
                    <button id="renameModuleOk" class="btn-primary">Rename</button>
                    <button id="renameModuleCancel" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="taskpane.js"></script>
</body>
</html>
